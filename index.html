<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frogman Eyeballs Follow Mouse</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #1b2f68, #0a1230 55%, #050917);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frog-stage {
      width: min(84vmin, 90vw);
      aspect-ratio: 1 / 1;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      user-select: none;
      -webkit-user-drag: none;
    }

    .frog-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .socket-rim {
      fill: none;
      stroke: none;
    }
  </style>
</head>
<body>
  <main class="frog-stage">
    <svg id="frog-svg" class="frog-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Frogman portrait with moving eyeballs">
      <defs>
        <clipPath id="left-eye-clip" clipPathUnits="userSpaceOnUse">
          <ellipse cx="33.5" cy="31.2" rx="6.85" ry="6.2" />
        </clipPath>
        <clipPath id="right-eye-clip" clipPathUnits="userSpaceOnUse">
          <ellipse cx="71.3" cy="31.2" rx="6.85" ry="6.2" />
        </clipPath>
        <mask id="face-with-eye-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <rect x="0" y="0" width="100" height="100" fill="white" />
          <ellipse cx="33.5" cy="31.2" rx="6.85" ry="6.2" fill="black" />
          <ellipse cx="71.3" cy="31.2" rx="6.85" ry="6.2" fill="black" />
        </mask>
        <filter id="socket-softness" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.28" />
        </filter>
      </defs>

      <ellipse cx="33.5" cy="31.2" rx="7.25" ry="6.55" fill="none" filter="url(#socket-softness)" />
      <ellipse cx="71.3" cy="31.2" rx="7.25" ry="6.55" fill="none" filter="url(#socket-softness)" />

      <g clip-path="url(#left-eye-clip)">
        <image id="left-eyeball" href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
      </g>
      <g clip-path="url(#right-eye-clip)">
        <image id="right-eyeball" href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
      </g>

      <image href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" mask="url(#face-with-eye-holes)" />
      <ellipse class="socket-rim" cx="33.5" cy="31.2" rx="6.95" ry="6.28" />
      <ellipse class="socket-rim" cx="71.3" cy="31.2" rx="6.95" ry="6.28" />
    </svg>
  </main>

  <script>
    const svg = document.getElementById("frog-svg");
    const eyes = [
      { image: document.getElementById("left-eyeball"), cx: 33.5, cy: 31.2, maxTravel: 1.45, yBias: 0.88 },
      { image: document.getElementById("right-eyeball"), cx: 71.3, cy: 31.2, maxTravel: 1.45, yBias: 0.88 },
    ];

    function moveEyeballs(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const pointerX = ((clientX - rect.left) / rect.width) * 100;
      const pointerY = ((clientY - rect.top) / rect.height) * 100;

      eyes.forEach((eye) => {
        const dx = pointerX - eye.cx;
        const dy = (pointerY - eye.cy) * eye.yBias;
        const distance = Math.hypot(dx, dy) || 1;
        const clamped = Math.min(distance, eye.maxTravel);
        const tx = (dx / distance) * clamped;
        const ty = (dy / distance) * clamped;

        eye.image.setAttribute("transform", `translate(${tx} ${ty})`);
      });
    }

    function resetEyeballs() {
      eyes.forEach((eye) => eye.image.removeAttribute("transform"));
    }

    window.addEventListener("mousemove", (event) => {
      moveEyeballs(event.clientX, event.clientY);
    });

    window.addEventListener("touchmove", (event) => {
      const touch = event.touches[0];
      if (touch) {
        moveEyeballs(touch.clientX, touch.clientY);
      }
    }, { passive: true });

    window.addEventListener("mouseleave", resetEyeballs);
    window.addEventListener("blur", resetEyeballs);
  </script>
</body>
</html>
